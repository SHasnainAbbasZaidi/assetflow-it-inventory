name: inventory_manager_flutter
description: AssetFlow IT inventory management by Mahzaidex Tech, developed by Hasnain Zaidi.
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI and Navigation
  provider: ^6.1.2
  intl: ^0.19.0

  # Storage / Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Files and QR Codes
  pdf: ^3.10.8
  qr_flutter: ^4.1.0
  file_picker: ^8.0.3
  
  # QR/Barcode (web-compatible)
  barcode: ^2.2.9
  http: ^1.2.2
  google_generative_ai: ^0.4.7
  image_picker: ^1.2.2
  mobile_scanner: ^6.0.2

  # CSV parsing
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
